<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Learning Wheel & Resource Hub</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, #818cf8, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .main-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 1300px;
            align-items: start;
        }

        @media (max-width: 968px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .panel h2 {
            font-size: 1.25rem;
            margin-bottom: 1.25rem;
            color: var(--text-main);
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text-main);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Center Layout for Wheel Section */
        .workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            width: 100%;
        }

        .wheel-wrapper {
            position: relative;
            width: 340px;
            height: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid var(--accent);
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 4px solid var(--border);
        }

        .wheel-btn {
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s, opacity 0.2s;
        }

        .wheel-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .wheel-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-display {
            background: rgba(30, 41, 59, 0.7);
            border: 1px dashed var(--border);
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            text-align: center;
            min-width: 280px;
        }

        .result-display span {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .result-display strong {
            font-size: 1.3rem;
            color: #38bdf8;
        }

        /* Recommendations Section */
        .recommendations-panel {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .recommendations-panel h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .rec-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
        }

        .rec-card {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            transition: border-color 0.2s, transform 0.2s;
        }

        .rec-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .rec-card h4 {
            font-size: 0.95rem;
            color: #818cf8;
        }

        .rec-card p {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <h1>Interactive Learning Hub</h1>
        <p>Dynamic concept spinner customized by topic, language, and proficiency level.</p>
    </header>

    <div class="main-container">
        <!-- Configuration Control Panel -->
        <div class="panel">
            <h2>Configuration</h2>
            <div id="config-form">
                <div class="form-group">
                    <label for="topic">Topic</label>
                    <input type="text" id="topic" value="Artificial Intelligence" placeholder="e.g. Quantum Physics, Cooking, Business">
                </div>

                <div class="form-group">
                    <label for="language">Language</label>
                    <select id="language">
                        <option value="English" selected>English</option>
                        <option value="Spanish">Spanish (Español)</option>
                        <option value="German">German (Deutsch)</option>
                        <option value="French">French (Français)</option>
                        <option value="Turkish">Turkish (Türkçe)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="level">Proficiency Level</label>
                    <select id="level">
                        <option value="Beginner">Beginner (A1/A2)</option>
                        <option value="Intermediate" selected>Intermediate (B1/B2)</option>
                        <option value="Advanced">Advanced (C1/C2)</option>
                    </select>
                </div>

                <button type="button" id="updateBtn" class="btn">Update Parameters</button>
            </div>
        </div>

        <!-- Center Wheel Workspace -->
        <div class="workspace">
            <div class="wheel-wrapper">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="320" height="320"></canvas>
            </div>

            <button class="wheel-btn" id="spinBtn" type="button">Spin the Wheel</button>

            <div class="result-display">
                <span>Selected Item</span>
                <strong id="resultText">Spin to select a concept!</strong>
            </div>
        </div>
    </div>

    <!-- Targeted Recommendations Section -->
    <div style="width: 100%; max-width: 1300px; margin-top: 2rem;">
        <div class="recommendations-panel">
            <h3 id="recHeader">Curated Resources & Specific Websites</h3>
            <div class="rec-grid" id="recGrid">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>

    <script>
        // State management
        let currentTopic = "Artificial Intelligence";
        let currentLanguage = "English";
        let currentLevel = "Intermediate";

        // Dynamic Data Pools based on parameters
        const dataMapping = {
            "Artificial Intelligence": {
                "Beginner": {
                    "English": ["Chatbot", "Algorithm", "Data", "Robot", "Smart Device", "Automation", "Input", "Output"],
                    "Spanish": ["Chatbot", "Algoritmo", "Datos", "Robot", "Dispositivo", "Automatización", "Entrada", "Salida"],
                    "German": ["Chatbot", "Algorithmus", "Daten", "Roboter", "Smart-Gerät", "Automatisierung", "Eingabe", "Ausgabe"],
                    "French": ["Chatbot", "Algorithme", "Données", "Robot", "Appareil", "Automatisation", "Entrée", "Sortie"],
                    "Turkish": ["Sohbet Botu", "Algoritma", "Veri", "Robot", "Akıllı Cihaz", "Otomasyon", "Girdi", "Çıktı"]
                },
                "Intermediate": {
                    "English": ["Machine Learning", "Neural Network", "Supervised Learning", "Deep Learning", "Natural Language Processing", "Computer Vision", "Training Data", "Overfitting"],
                    "Spanish": ["Aprendizaje automático", "Red neuronal", "Aprendizaje supervisado", "Aprendizaje profundo", "Procesamiento de lenguaje", "Visión artificial", "Datos de entrenamiento", "Sobreajuste"],
                    "German": ["Maschinelles Lernen", "Neuronales Netz", "Überwachtes Lernen", "Deep Learning", "Sprachverarbeitung", "Computer Vision", "Trainingsdaten", "Overfitting"],
                    "French": ["Apprentissage automatique", "Réseau de neurones", "Apprentissage supervisé", "Apprentissage profond", "Traitement du langage", "Vision par ordinateur", "Données d'entraînement", "Surajustement"],
                    "Turkish": ["Makine Öğrenmesi", "Yapay Sinir Ağı", "Denetimli Öğrenme", "Derin Öğrenme", "Doğal Dil İşleme", "Bilgisayarlı Görü", "Eğitim Verisi", "Aşırı Uyum"]
                },
                "Advanced": {
                    "English": ["Transformer Architecture", "Attention Mechanism", "Reinforcement Learning", "Generative Adversarial Networks", "Latent Space", "Vector Embeddings", "Backpropagation", "Stochastic Gradient Descent"],
                    "Spanish": ["Arquitectura Transformer", "Mecanismo de atención", "Aprendizaje por refuerzo", "Redes generativas adversarias", "Espacio latente", "Incrustaciones vectoriales", "Retropropagación", "Descenso de gradiente"],
                    "German": ["Transformer-Architektur", "Aufmerksamkeitsmechanismus", "Reinforcement Learning", "GANs", "Latenter Raum", "Vektor-Embeddings", "Backpropagation", "Stochastischer Gradientenabstieg"],
                    "French": ["Architecture Transformer", "Mécanisme d'attention", "Apprentissage par renforcement", "GANs", "Espace latent", "Plongements vectoriels", "Rétropropagation", "Descente de gradient stochastique"],
                    "Turkish": ["Transformer Mimarisi", "Dikkat Mekanizması", "Pekiştirmeli Öğrenme", "Üretken Çekişmeli Ağlar", "Gizli Uzay", "Vektör Gömme", "Geri Yayılım", "Stokastik Gradyan İnişi"]
                }
            }
        };

        const websiteMapping = {
            "Artificial Intelligence": [
                { name: "Hugging Face Hub", url: "https://huggingface.co", desc: "The platform where machine learning engineers build, test, and deploy models." },
                { name: "PapersWithCode", url: "https://paperswithcode.com", desc: "Latest trending AI research papers matched with open-source implementations." },
                { name: "Kaggle", url: "https://www.kaggle.com", desc: "Community platform for data science competitions, datasets, and notebooks." }
            ]
        };

        function getDynamicItems(topic, level, language) {
            if (dataMapping[topic] && dataMapping[topic][level] && dataMapping[topic][level][language]) {
                return dataMapping[topic][level][language];
            }
            return [
                `${topic} - 1`, `${topic} - 2`, `${topic} - 3`, `${topic} - 4`, 
                `${topic} - 5`, `${topic} - 6`, `${topic} - 7`, `${topic} - 8`
            ];
        }

        function getSpecificWebsites(topic) {
            if (websiteMapping[topic]) {
                return websiteMapping[topic];
            }
            return [
                { name: `${topic} Research Portal`, url: "https://scholar.google.com", desc: `Peer-reviewed academic articles and specific journals covering ${topic}.` },
                { name: `Advanced ${topic} Docs`, url: "https://developer.mozilla.org", desc: `Comprehensive technical documentation and tutorials on ${topic}.` },
                { name: `Global ${topic} Community`, url: "https://github.com", desc: `Open source code repositories and collaborative projects focused on ${topic}.` }
            ];
        }

        let items = getDynamicItems(currentTopic, currentLevel, currentLanguage);

        // Canvas Wheel Setup
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const updateBtn = document.getElementById('updateBtn');
        const resultText = document.getElementById('resultText');

        let startAngle = 0;
        let arc = Math.PI / (items.length / 2);
        let spinTimeout = null;
        let spinAngleStart = 0;
        let spinTime = 0;
        let spinTimeTotal = 0;
        let isSpinning = false;

        const colors = ['#6366f1', '#ec4899', '#3b82f6', '#8b5cf6', '#14b8a6', '#f59e0b', '#10b981', '#ef4444'];

        function drawWheel() {
            arc = Math.PI / (items.length / 2);
            ctx.clearRect(0, 0, 320, 320);

            const outsideRadius = 150;
            const textRadius = 100;
            const insideRadius = 0;

            ctx.lineWidth = 2;

            for (let i = 0; i < items.length; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % colors.length];

                ctx.beginPath();
                ctx.arc(160, 160, outsideRadius, angle, angle + arc, false);
                ctx.arc(160, 160, insideRadius, angle + arc, angle, true);
                ctx.stroke();
                ctx.fill();

                ctx.save();
                ctx.fillStyle = "#ffffff";
                ctx.translate(160 + Math.cos(angle + arc / 2) * textRadius, 160 + Math.sin(angle + arc / 2) * textRadius);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                let text = items[i];
                if (text.length > 12) text = text.substring(0, 10) + '...';
                ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
                ctx.restore();
            }

            // Draw center hub
            ctx.beginPath();
            ctx.arc(160, 160, 20, 0, 2 * Math.PI, false);
            ctx.fillStyle = '#1e293b';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#334155';
            ctx.stroke();
        }

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            let spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function stopRotateWheel() {
            isSpinning = false;
            spinBtn.disabled = false;
            
            let degrees = startAngle * 180 / Math.PI;
            let arcd = arc * 180 / Math.PI;
            let pointerAngle = (270 - degrees) % 360;
            if (pointerAngle < 0) pointerAngle += 360;
            let index = Math.floor(pointerAngle / arcd) % items.length;

            let text = items[index];
            resultText.innerHTML = `${text} <span style="font-size:0.8rem; color:#94a3b8; display:block; margin-top:2px;">(${currentLanguage} • ${currentLevel})</span>`;
        }

        function easeOut(t, b, c, d) {
            let ts = (t /= d) * t;
            let tc = ts * t;
            return b + c * (tc + -3 * ts + 3 * t);
        }

        // Spin button click handler
        spinBtn.addEventListener("click", () => {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            resultText.innerText = "Spinning...";
            spinAngleStart = Math.random() * 10 + 20;
            spinTime = 0;
            spinTimeTotal = Math.random() * 2000 + 3000;
            rotateWheel();
        });

        // Update recommendations UI
        function updateRecommendations() {
            const recGrid = document.getElementById('recGrid');
            const recHeader = document.getElementById('recHeader');
            recHeader.innerText = `Curated Websites for: ${currentTopic} (${currentLanguage}, ${currentLevel})`;
            
            const sites = getSpecificWebsites(currentTopic);
            recGrid.innerHTML = sites.map(site => `
                <a href="${site.url}" target="_blank" rel="noopener noreferrer" class="rec-card">
                    <h4>${site.name} ↗</h4>
                    <p>${site.desc}</p>
                </a>
            `).join('');
        }

        // Update parameters button click handler
        updateBtn.addEventListener("click", () => {
            const topicInput = document.getElementById('topic').value.trim();
            currentTopic = topicInput || "General Study";
            currentLanguage = document.getElementById('language').value;
            currentLevel = document.getElementById('level').value;

            items = getDynamicItems(currentTopic, currentLevel, currentLanguage);
            startAngle = 0;
            drawWheel();
            updateRecommendations();
            resultText.innerText = "Parameters updated! Spin the wheel.";
        });

        // Initial render
        drawWheel();
        updateRecommendations();
    </script>
</body>
</html>
